[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpe-tokenizer"
version = "0.1.0"
description = "High-performance, secure Byte Pair Encoding (BPE) tokenizer in Python from scratch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "cibi-dev" }
]
dependencies = [
    "regex>=2024.0,<2026",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-regex>=2024.0.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
