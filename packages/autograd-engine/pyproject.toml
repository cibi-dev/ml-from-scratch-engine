[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autograd-engine"
version = "0.1.0"
description = "A lightweight, pure Python reverse-mode automatic differentiation engine and neural network library from scratch."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "cibi-dev" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["autograd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]