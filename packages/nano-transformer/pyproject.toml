[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nano-transformer"
version = "0.1.0"
description = "A lightweight character-level Transformer language model (~1M parameters) built from scratch in PyTorch."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "cibi-dev" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["nano_transformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=nano_transformer --cov-fail-under=90"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]