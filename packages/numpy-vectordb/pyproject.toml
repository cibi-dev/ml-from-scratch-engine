[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numpy-vectordb"
version = "0.1.0"
description = "Hardened Pure NumPy Vector Database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "cibi-dev" }
]
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^examples/',
    '^\.venv/',
]
[tool.hatch.build.targets.wheel]
packages = ["numpy_vectordb"]
