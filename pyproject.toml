[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-scratch-engine"
version = "1.0.0"
description = "Enterprise Machine Learning From Scratch Suite: Autograd, Nano Transformer, VectorDB, BPE Tokenizer, MinHash Deduplication & Self-Healing Guardrails"
readme = "README.md"
authors = [{ name = "cibi-dev", email = "cibi@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["machine-learning", "deep-learning", "autograd", "transformer", "vectordb", "bpe-tokenizer", "minhash", "lsh", "guardrails"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "regex>=2024.0",
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.5",
    "mypy>=1.10.0",
    "respx>=0.22",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mlcore = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages/autograd-engine",
    "packages/bpe-tokenizer",
    "packages/guardrails-engine",
    "packages/minhash-dedup",
    "packages/nano-transformer",
    "packages/numpy-vectordb",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", ".pytest_cache", ".mypy_cache"]
skips = ["B101", "B311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = [
    '^tests/',
    '^benchmarks/',
    '^packages/.*/tests/',
    '^packages/.*/benchmarks/',
    '^packages/.*/examples/',
    '^\.venv/',
]
